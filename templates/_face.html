{# Simple illustrated faces for the two tutors. Usage: {{ face('yuri') }} #}
{% macro face(key) %}
<svg class="face" viewBox="0 0 200 200" role="img" aria-label="{{ key }}">
  {% if key == 'yuri' %}
  <rect width="200" height="200" fill="#fde3ea"/>
  <path d="M38 200 Q100 150 162 200Z" fill="#ef6f8f"/>
  <rect x="88" y="138" width="24" height="26" rx="8" fill="#f3d2bd"/>
  <path d="M42 90 Q42 36 100 34 Q158 36 158 90 L162 178 Q130 190 128 140 L72 140 Q70 190 38 178Z" fill="#3a2828"/>
  <ellipse cx="100" cy="96" rx="45" ry="50" fill="#fbe3d0"/>
  <path d="M55 84 Q70 44 102 46 Q140 48 146 86 Q118 62 88 70 Q68 74 55 84Z" fill="#3a2828"/>
  {% else %}
  <rect width="200" height="200" fill="#dcebfa"/>
  <path d="M38 200 Q100 150 162 200Z" fill="#6b8e7a"/>
  <rect x="88" y="138" width="24" height="26" rx="8" fill="#f3d2bd"/>
  <ellipse cx="100" cy="96" rx="45" ry="50" fill="#fbe3d0"/>
  <path d="M52 92 Q48 40 100 38 Q152 40 148 92 Q140 62 100 60 Q62 62 52 92Z" fill="#2f2420"/>
  <g fill="none" stroke="#2b2530" stroke-width="3"><circle cx="81" cy="98" r="14"/><circle cx="119" cy="98" r="14"/><path d="M95 98 H105"/></g>
  {% endif %}
  <g class="eyes" fill="#2b2530"><ellipse cx="81" cy="98" rx="4" ry="5"/><ellipse cx="119" cy="98" rx="4" ry="5"/></g>
  <circle cx="68" cy="112" r="7" fill="#f4a6a6" opacity=".45"/><circle cx="132" cy="112" r="7" fill="#f4a6a6" opacity=".45"/>
  <ellipse class="mouth" cx="100" cy="123" rx="10" ry="4" fill="#b8434f"/>
</svg>
{% endmacro %}
